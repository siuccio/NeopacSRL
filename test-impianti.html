<!DOCTYPE html>
<html>
<head>
  <title>Test Impianti JSON</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #5a5a5a;
      --accent: #bf8021;
      --primary: #213550;
    }
    body { font-family: system-ui; background: var(--bg); color: var(--text); padding: 20px; }
    #sections-container { max-width: 1200px; margin: 0 auto; }
    .section-content { margin-bottom: 40px; }
    .section-content h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
    .subsection { margin-bottom: 30px; }
    .subsection h3 { color: var(--primary); margin: 0 0 12px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .card { border-radius: 12px; overflow: hidden; background: var(--surface); text-align: center; cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .card p { padding: 8px; margin: 0; color: var(--text); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Test: Impianti JSON Population</h1>
  <div id="sections-container">Loading...</div>
  
  <script>
    const container = document.getElementById('sections-container');
    const lang = 'it';
    const langKey = `name_${lang}`;
    const titleKey = `title_${lang}`;
    
    fetch('./data/impianti.json')
      .then(r => r.json())
      .then(d => {
        container.innerHTML = '';
        d.sections.forEach(section => {
          const sectionEl = document.createElement('section');
          sectionEl.className = 'section-content';
          
          const h2 = document.createElement('h2');
          h2.textContent = section[titleKey] || section.title_it;
          h2.style.marginBottom = '18px';
          sectionEl.appendChild(h2);
          
          section.subsections.forEach(sub => {
            const subDiv = document.createElement('div');
            subDiv.className = 'subsection';
            
            const h3 = document.createElement('h3');
            h3.textContent = sub[titleKey] || sub.title_it;
            h3.style.marginBottom = '12px';
            subDiv.appendChild(h3);
            
            const grid = document.createElement('div');
            grid.className = 'grid';
            
            sub.items.forEach(item => {
              const card = document.createElement('div');
              card.className = 'card';
              
              const img = document.createElement('img');
              img.src = item.image;
              img.alt = item[langKey] || item.name_it;
              
              const name = document.createElement('p');
              name.textContent = item[langKey] || item.name_it;
              
              card.appendChild(img);
              card.appendChild(name);
              grid.appendChild(card);
            });
            
            subDiv.appendChild(grid);
            sectionEl.appendChild(subDiv);
          });
          
          container.appendChild(sectionEl);
        });
        
        console.log(`✓ Loaded ${d.sections.length} sections`);
      })
      .catch(e => {
        container.textContent = 'Error: ' + e.message;
        console.error('Error loading impianti:', e);
      });
  </script>
</body>
</html>
